services:
  # Kafka en modo KRaft (1 solo broker)
  kafka:
    image: apache/kafka:3.7.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MongoDB como Replica Set
  mongo:
    image: mongo:7.0
    container_name: rutasur-mongo
    hostname: mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --eval 'try { if (rs.status().myState === 1) { quit(0); } else { rs.reconfig({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}, {force: true}); quit(1); } } catch(e) { rs.initiate({_id: \"rs0\", members: [{_id: 0, host: \"mongo:27017\"}]}); quit(1); }'",
        ]
      interval: 5s
      timeout: 10s
      retries: 15
      start_period: 10s

  # Interfaz gráfica para inspeccionar Kafka (Kafdrop)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: rutasur-kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      - kafka

  # SERVICIOS
  simulador:
    build:
      context: ./services/simulador
    container_name: rutasur-simulador
    env_file:
      - .env
    restart: unless-stopped
    ports:
      - "4000:4000"
    depends_on:
      kafka:
        condition: service_healthy

  proyector:
    build:
      context: ./services/proyector
    container_name: rutasur-proyector
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started

  reprogramacion:
    build:
      context: ./services/reprogramacion
    container_name: rutasur-reprogramacion
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started

  notificaciones:
    build:
      context: ./services/notificaciones
    container_name: rutasur-notificaciones
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started

  monitor-sla:
    build:
      context: ./services/monitor-sla
    container_name: rutasur-monitor-sla
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started

  analitica:
    build:
      context: ./services/analitica
    container_name: rutasur-analitica
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      mongo:
        condition: service_healthy
      simulador:
        condition: service_started

  # Frontend
  frontend:
    build:
      context: ./frontend
    container_name: rutasur-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - MONGO_URI=mongodb://mongo:27017/rutasur?replicaSet=rs0&directConnection=true
      - SIMULADOR_URL=http://simulador:4000
      - NEXT_PUBLIC_SIMULADOR_URL=http://localhost:4000
      - HOSTNAME=0.0.0.0
    depends_on:
      mongo:
        condition: service_healthy