services:
  # Kafka en modo KRaft (1 solo broker)
  kafka:
    image: apache/kafka:3.7.0
    container_name: rutasur-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  # MongoDB como Replica Set
  mongo:
    image: mongo:7.0
    container_name: rutasur-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rutasur2026
    healthcheck:
      test: test $$(echo "rs.initiate().ok || rs.status().ok" | mongosh -u root -p rutasur2026 --quiet) -eq 1
      interval: 10s
      start_period: 30s

  # Interfaz gráfica para inspeccionar Kafka (Kafdrop)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: rutasur-kafdrop
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:9092"
    depends_on:
      - kafka

  simulador:
    build:
      context: ./services/simulador
    container_name: rutasur-simulador
    env_file:
      - .env
    ports:
      - "4000:4000"
    depends_on:
      - kafka